function make_grid_demo_parent_ids(row_count, tree_depth) {
	let parent_ids = Array(row_count).fill(null)
	if (!row_count || !tree_depth)
		return parent_ids

	let branching = max(1, ceil((row_count - 1) ** (1 / tree_depth)))
	let level_starts = [0]
	let level_counts = [1]
	let remaining = row_count - 1
	for (let level_i = 1;
		level_i <= tree_depth && remaining;
		level_i++) {
		let parent_count = level_counts[level_i - 1]
		let max_count = parent_count * branching
		let levels_left = tree_depth - level_i + 1
		let level_count = min(max_count, ceil(remaining / levels_left))
		level_starts.push(
			level_starts[level_i - 1] + parent_count)
		level_counts.push(level_count)
		remaining -= level_count
	}

	for (let level_i = 1; level_i < level_counts.length; level_i++) {
		let parent_start = level_starts[level_i - 1]
		let parent_count = level_counts[level_i - 1]
		let child_start = level_starts[level_i]
		let child_count = level_counts[level_i]
		for (let child_i = 0; child_i < child_count; child_i++) {
			let parent_i = parent_start
				+ floor(child_i * parent_count / child_count)
			parent_ids[child_start + child_i] = parent_i + 1
		}
	}
	return parent_ids
}

function make_grid_demo_rowset(
	row_count, tree_depth, first_col, col_count
) {
	let parent_ids = make_grid_demo_parent_ids(row_count, tree_depth)
	let fields = grid_demo_source_fields.map(field => ({...field}))
	let source_field = grid_demo_source_fields[
		grid_demo_source_field_i[first_col]]
	let dup_col_count = max(0, col_count - grid_demo_base_field_count)
	for (let duplicate_i = 1;
		duplicate_i <= dup_col_count; duplicate_i++) {
		let field = {...source_field}
		field.name = first_col+'_duplicate_'+duplicate_i
		field.label = (source_field.label ?? first_col)
			+' duplicate '+duplicate_i
		field.internal = false
		fields.push(field)
	}

	let cols = [first_col]
	for (let col of grid_demo_base_cols)
		if (col != first_col)
			cols.push(col)
	for (let duplicate_i = 1;
		duplicate_i <= dup_col_count; duplicate_i++)
		cols.push(first_col+'_duplicate_'+duplicate_i)

	let rows = []
	for (let row_i = 0; row_i < row_count; row_i++) {
		let sample_row = grid_demo_source_rows[
			row_i % grid_demo_source_rows.length]
		let row = []
		for (let field_i = 0; field_i < grid_demo_source_fields.length;
			field_i++) {
			let field = grid_demo_source_fields[field_i]
			let value = sample_row[field_i]
			if (field.name == 'id')
				value = row_i + 1
			else if (field.name == 'parent_id')
				value = parent_ids[row_i]
			row.push(value)
		}
		let duplicate_value = sample_row[grid_demo_source_field_i[first_col]]
		if (first_col == 'id')
			duplicate_value = row_i + 1
		for (let duplicate_i = 1;
			duplicate_i <= dup_col_count;
			duplicate_i++)
			row.push(duplicate_value)
		rows.push(row)
	}

	return {
		pk: 'id',
		parent_col: 'parent_id',
		cols: cols.join(' '),
		fields: fields,
		rows: rows,
	}
}

let remote_offer_con, remote_answer_con

ui.frame_changed = async function() {
	let con = remote_offer_con ?? offer_con
	if (!con && !is_packing) return
	let cb = await ui.pack_frame()
	if (con)
		con.send(cb)
	if (is_packing)
		await ui.unpack_frame(cb)
}

listen('rtc', function(c) {
	ui.animate()

	remote_offer_con.connect('local')
